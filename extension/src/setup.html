<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Nadeye setup</title>
    <style>
      body { font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
             max-width: 620px; margin: 60px auto; padding: 0 20px; color: #1c2430; }
      h1 { font-size: 22px; }
      .bar { height: 10px; background: #e7ebf0; border-radius: 5px; overflow: hidden; margin: 18px 0; }
      .bar > div { height: 100%; width: 0%; background: #6e54ff; transition: width 0.2s; }
      button { padding: 8px 18px; border-radius: 8px; border: 1px solid #6e54ff;
               background: #6e54ff; color: white; font-size: 15px; cursor: pointer; }
      button:focus-visible { outline: 2px solid #6e54ff; outline-offset: 2px; }
      button:disabled { opacity: .5; cursor: default; }
      #status { color: #475569; min-height: 24px; }
      .dev { margin-top: 40px; padding-top: 16px; border-top: 1px solid #e2e8f0; color: #64748b; font-size: 13px; }
    </style>
  </head>
  <body>
    <h1>Nadeye: one-time model setup</h1>
    <p>
      Nadeye needs to download its detection model, Sieve, once (~45&nbsp;MB). After that,
      everything runs on your device: no image ever leaves your browser, and nothing else
      is downloaded.
    </p>
    <div class="bar"><div id="progress"></div></div>
    <p id="status">Ready to download.</p>
    <button id="download">Download model</button>
    <div class="dev">
      <p>Developer: load a local .onnx file instead.</p>
      <input type="file" id="localfile" accept=".onnx" />
    </div>
    <script src="setup.js"></script>
  </body>
</html>

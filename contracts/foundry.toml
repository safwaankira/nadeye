[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "prague"
optimizer = true
optimizer_runs = 1000
via_ir = true

[rpc_endpoints]
monad_testnet = "https://testnet-rpc.monad.xyz"
monad_mainnet = "https://rpc.monad.xyz"

[invariant]
runs = 256
depth = 120
fail_on_revert = true
call_override = false

[fuzz]
runs = 1000

# FOUNDRY_PROFILE=deep forge test: the final-pass campaign (about 205,000 calls per invariant)
[profile.deep]

[profile.deep.invariant]
runs = 1024
depth = 200
fail_on_revert = true

[profile.deep.fuzz]
runs = 5000
